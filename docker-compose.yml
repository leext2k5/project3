services:
  # ---------- Mạng ICS được giám sát ----------
  plc:
    build: ./lab
    image: ics-lab
    command: python plc_sim.py
    networks:
      ics_net:
        ipv4_address: 172.28.0.10

  hmi:
    image: ics-lab
    command: python hmi_sim.py
    environment:
      PLC_HOST: 172.28.0.10
    depends_on:
      - plc
    networks:
      ics_net:
        ipv4_address: 172.28.0.20

  # ---------- Nền tảng giám sát ----------
  # Sensor chạy ở chế độ mạng host để quan sát bridge br-ics (giám sát thụ động),
  # và gửi event về backend qua cổng 8000 đã publish (tới được qua 127.0.0.1).
  sensor:
    image: ics-lab
    command: python sensor.py
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      BACKEND_URL: http://127.0.0.1:8000/api/events
    depends_on:
      - plc
      - hmi
      - backend

  backend:
    image: ics-lab
    command: python backend.py
    environment:
      DB_DSN: postgresql://ics:ics@db:5432/ics
    ports:
      - "8000:8000"      # mở ra Mac host để dashboard/kiểm thử truy cập
    volumes:
      - ./web:/app/web:ro   # phục vụ dashboard tĩnh từ backend (cùng origin)
    depends_on:
      - db
    networks:
      - mon_net

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ics
      POSTGRES_PASSWORD: ics
      POSTGRES_DB: ics
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    networks:
      - mon_net

networks:
  ics_net:                       # mạng công nghiệp giả lập
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-ics
    ipam:
      config:
        - subnet: 172.28.0.0/24
  mon_net:                       # mạng riêng của nền tảng giám sát (backend + db)
    driver: bridge

volumes:
  pgdata:
