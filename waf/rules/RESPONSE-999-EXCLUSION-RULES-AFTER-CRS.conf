# =============================================================================
# RESPONSE-999 — Luật tùy chỉnh nạp SAU bộ luật OWASP CRS
# =============================================================================
# Dùng cho các ngoại lệ dạng "configure-time" (thực hiện một lần khi khởi động),
# ví dụ loại bỏ hẳn một luật hoặc một target của luật trên toàn hệ thống.
# Các directive này phải đặt SAU khi luật được định nghĩa, vì vậy nằm ở file này.
#
# Ví dụ (đang tắt):
#
# Tắt hoàn toàn luật 920350 (Host header là địa chỉ IP) — hữu ích trong lab
# khi truy cập WAF bằng http://127.0.0.1:8080 :
# SecRuleRemoveById 920350
#
# Không kiểm tra cookie "session_tracking" với toàn bộ luật SQLi:
# SecRuleUpdateTargetByTag attack-sqli "!REQUEST_COOKIES:session_tracking"
# =============================================================================
