# =============================================================================
# REQUEST-900 — Luật tùy chỉnh nạp TRƯỚC bộ luật OWASP CRS
# =============================================================================
# File này được mount vào /opt/owasp-crs/rules/ và được nạp theo thứ tự tên,
# tức là trước REQUEST-901-INITIALIZATION.conf. Dùng để:
#   1. Viết luật riêng cho ứng dụng (virtual patch, positive security).
#   2. Khai báo ngoại lệ (rule exclusion) để xử lý false positive.
#
# Dải ID dành cho luật cục bộ: 1 – 99.999 (theo khuyến nghị của CRS).
# Sau khi sửa file:  docker compose restart waf
# =============================================================================


# -----------------------------------------------------------------------------
# [1000100] Virtual patch: /product chỉ nhận tham số id là số nguyên
# -----------------------------------------------------------------------------
# Ứng dụng Flask có lỗi Numeric SQL Injection ở /product?id=... Thay vì chờ sửa
# mã nguồn, WAF "vá ảo" bằng cách chỉ chấp nhận id gồm 1–9 chữ số.
# Luật không chặn trực tiếp mà cộng điểm CRITICAL (5) vào anomaly score
# của paranoia level 1 — đúng mô hình chấm điểm của CRS. Quyết định chặn vẫn do
# luật 949110 so sánh tổng điểm với ngưỡng (ANOMALY_INBOUND).
SecRule REQUEST_FILENAME "@streq /product" \
    "id:1000100,\
    phase:2,\
    pass,\
    t:none,\
    log,\
    msg:'Virtual patch: tham so id cua /product phai la so nguyen',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'attack-sqli',\
    tag:'custom-rule',\
    tag:'virtual-patch',\
    tag:'paranoia-level/1',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS_GET:id "!@rx ^[0-9]{1,9}$" \
        "t:none,\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
        setvar:'tx.sql_injection_score=+%{tx.critical_anomaly_score}'"


# -----------------------------------------------------------------------------
# Mẫu xử lý FALSE POSITIVE (đang tắt — bỏ dấu # khi cần)
# -----------------------------------------------------------------------------
# a) Bỏ kiểm tra một tham số cụ thể với một luật cụ thể, chỉ trên một URL:
#    Ví dụ: nội dung góp ý hay chứa đoạn mã nguồn hợp lệ làm luật 941100 (XSS) báo nhầm.
#
# SecRule REQUEST_FILENAME "@streq /feedback" \
#     "id:1000200,phase:1,pass,nolog,\
#     ctl:ruleRemoveTargetById=941100;ARGS:content"
#
# b) Tắt cả một nhóm luật (theo tag) cho một tham số:
#
# SecRule REQUEST_FILENAME "@streq /api/feedback" \
#     "id:1000201,phase:1,pass,nolog,\
#     ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.content"
#
# c) Cho phép một IP quản trị nội bộ bỏ qua WAF (KHÔNG khuyến nghị trong thực tế):
#
# SecRule REMOTE_ADDR "@ipMatch 10.10.10.10" \
#     "id:1000202,phase:1,pass,nolog,ctl:ruleEngine=Off"
