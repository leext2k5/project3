{% extends "base.html" %}
{% block title %}Đăng nhập — WAF Lab Shop{% endblock %}
{% block content %}
<div class="card">
  <h2>Đăng nhập</h2>
  <form method="post" action="/login">
    <label for="username">Tên đăng nhập</label>
    <input type="text" id="username" name="username" value="{{ username }}">
    <label for="password">Mật khẩu</label>
    <input type="password" id="password" name="password">
    <button type="submit">Đăng nhập</button>
  </form>
  {% if result %}
    <p class="{{ 'ok' if result.ok else 'err' }}" id="login-result">{{ result.msg }}</p>
  {% endif %}
  {% if query %}
    <p class="note">Câu SQL backend đã thực thi (hiển thị cho mục đích học tập):</p>
    <pre>{{ query }}</pre>
  {% endif %}
</div>
{% endblock %}
